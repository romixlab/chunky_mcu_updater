[package]
name = "chunky_ww"
description = "chunky on WireWeaver: serves ww_dfu UpdateNode, BootControl, Inventory and Stage on the apply engine and a boot backend (no_std)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Passed on to chunky: one of them must be chosen.
ed25519 = ["chunky/ed25519"]
unsigned = ["chunky/unsigned"]

[dependencies]
chunky.workspace = true
embedded-storage.workspace = true
# wire_weaver from GitHub, pinned by Cargo.lock; local sibling work: see AGENTS.md "wire_weaver dependency".
ww_dfu = { git = "https://github.com/vhrdtech/ww_stdlib", default-features = false }
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# the counted units of ww_dfu's typed numbers (steps, chunks, bytes)
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["counting", "information"] }

[dev-dependencies]
chunky = { workspace = true, features = ["ed25519", "unsigned"] }
