[package]
name = "chunky_ww_host"
description = "chunky on WireWeaver, host side: updates a chunky_ww device over ww_dfu (plan, pipelined steps, reboot, trial, confirm)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
chunky = { workspace = true, features = ["ed25519", "unsigned"] }
chunky_server.workspace = true
chunky_ww = { workspace = true, features = ["ed25519", "unsigned"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
# wire_weaver from GitHub, pinned by Cargo.lock; local sibling work: see AGENTS.md "wire_weaver dependency".
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver" }
wire_weaver_client = { git = "https://github.com/vhrdtech/wire_weaver" }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver" }

[dev-dependencies]
chunky_sim.workspace = true
chunky_ww_test_api = { path = "tests/api" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
wire_weaver_client = { git = "https://github.com/vhrdtech/wire_weaver", features = ["in_process"] }
ww_client_server = { git = "https://github.com/vhrdtech/wire_weaver" }
ww_device = { git = "https://github.com/vhrdtech/wire_weaver" }
