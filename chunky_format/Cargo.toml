[package]
name = "chunky_format"
description = "The chunky wire format as shrink_wrap types with a fixed little-endian layout, and a constant-offset reader for minimal bootloaders (no_std)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# wire_weaver from GitHub, pinned by Cargo.lock; local sibling work: see AGENTS.md "wire_weaver dependency".
shrink_wrap = { git = "https://github.com/romixlab/shrink_wrap", default-features = false }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
sha2.workspace = true
