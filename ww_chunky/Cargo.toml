[package]
name = "ww_chunky"
description = "ww-chunky: the chunky updates of ww dfu flash, as a plugin of the ww command line (wire_weaver)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "ww-chunky"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chunky_ww_cli.workspace = true
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wire_weaver_cli = { git = "https://github.com/vhrdtech/wire_weaver" }
wire_weaver_client = { git = "https://github.com/vhrdtech/wire_weaver", features = ["hub"] }
